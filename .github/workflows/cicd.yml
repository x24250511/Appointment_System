name: SecureFlow CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: us-east-1
  EB_APPLICATION_NAME: appointment_system
  EB_ENVIRONMENT_NAME: secureflow-env

jobs:
  # Job 1: Code Quality & Security Analysis
  code-quality:
    name: Code Quality & SAST
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for SonarQube
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pylint bandit safety
    
    - name: Run Pylint
      run: |
        pylint **/*.py --exit-zero --output-format=json > pylint-report.json || true
      continue-on-error: true
    
    - name: Run Bandit (Security Linter)
      run: |
        bandit -r . -f json -o bandit-report.json || true
      continue-on-error: true
    
    - name: Check Dependencies for Vulnerabilities
      run: |
        safety check --json > safety-report.json || true
      continue-on-error: true
    
    - name: Upload Security Reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          pylint-report.json
          bandit-report.json
          safety-report.json

  # Job 2: Build & Deploy to AWS
  deploy:
    name: Deploy to AWS Elastic Beanstalk
    runs-on: ubuntu-latest
    needs: code-quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install EB CLI
      run: |
        pip install awsebcli
    
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Deploy to Elastic Beanstalk
      run: |
        eb init -p python-3.11 ${{ env.EB_APPLICATION_NAME }} --region ${{ env.AWS_REGION }}
        eb use ${{ env.EB_ENVIRONMENT_NAME }}
        eb deploy --staged
    
    - name: Verify Deployment
      run: |
        eb status ${{ env.EB_ENVIRONMENT_NAME }}

  # Job 3: DAST with OWASP ZAP
  security-scan:
    name: OWASP ZAP Security Scan
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: ZAP Baseline Scan
      uses: zaproxy/action-baseline@v0.12.0
      with:
        target: 'http://secureflow-env.eba-2gp2b6pj.us-east-1.elasticbeanstalk.com'
        rules_file_name: '.zap/rules.tsv'
        cmd_options: '-a -j -l WARN'
    
    - name: Upload ZAP Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: zap-report
        path: |
          report_html.html
          report_json.json