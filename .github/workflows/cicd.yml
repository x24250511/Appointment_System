name: SecureFlow - DevSecOps Pipeline

on:
  push:
    branches:
      - main

jobs:
  # 1) LINT JOB (PYLINT)
  lint:
    runs-on: ubuntu-latest
    name: Lint Code (pylint)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint pylint-django
      - name: Run pylint
        run: pylint . --exit-zero 

  # 2) SECURITY JOB (BANDIT + SAFETY)
  security:
    runs-on: ubuntu-latest
    needs: lint
    name: Security Scan (Bandit + Safety)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install security tools
        run: pip install bandit safety
      - name: Bandit (SAST)
        run: bandit -r . -ll --exit-zero
      - name: Safety (dependency vulnerabilities)
        run: safety check || true

  # 3) TEST JOB (PYTEST + COVERAGE)
  tests:
    runs-on: ubuntu-latest
    needs: security
    name: Pytest + Coverage
    env:
      DJANGO_SETTINGS_MODULE: config.settings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-django
      - name: Run pytest with coverage
        run: pytest --cov=. --cov-report=xml || [ $? -eq 5 ]
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

  # 4) SONARCLOUD JOB 
  sonar:
    runs-on: ubuntu-latest
    needs: tests
    name: SonarCloud Scan
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=x24250511_Appointment_System
            -Dsonar.organization=x24250511
            -Dsonar.sources=.
            -Dsonar.exclusions=**/migrations/**,**/venv/**,**/static/**,application.zip
            -Dsonar.python.version=3.11
            -Dsonar.python.coverage.reportPaths=coverage.xml

  # 5) DEPLOY TO AWS ELASTIC BEANSTALK
  deploy:
    runs-on: ubuntu-latest
    needs: sonar  
    name: Deploy to Elastic Beanstalk
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Zip application
        run: zip -r application.zip . -x "*.git*" "*.github*" "application.zip" "venv/*" "*__pycache__*" "*.pyc"

      - name: EB deploy
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_session_token: ${{ secrets.AWS_SESSION_TOKEN }}
          application_name: appointment_system
          environment_name: secureflow-env
          version_label: v-${{ github.run_number }}
          region: us-east-1
          deployment_package: application.zip

  # 6) OWASP ZAP SECURITY SCAN
  zap_scan:
    runs-on: ubuntu-latest
    needs: deploy
    name: OWASP ZAP Baseline Scan
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://secureflow-env.eba-2gp2b6pj.us-east-1.elasticbeanstalk.com/'
          allow_issue_writing: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}